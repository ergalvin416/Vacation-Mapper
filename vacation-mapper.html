r(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);font-size:11px;max-width:280px;pointer-events:none}.map-bottom{position:absolute;bottom:38px;right:16px;z-index:2}.map-help{position:absolute;bottom:38px;left:24px;border:1px solid var(--line);border-radius:50px;background:var(--panel);color:var(--muted);font-size:11px;padding:9px 15px;pointer-events:none}.empty{padding:45px 18px;text-align:center;color:var(--muted)}.empty svg{width:34px;height:34px;margin-bottom:10px}.empty h2{font:24px Georgia,serif;color:var(--text)}.sheet-handle{display:none}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--accent);color:var(--on-accent);border-radius:12px;padding:12px 20px;box-shadow:var(--shadow);z-index:1000}.toast[hidden]{display:none}dialog{color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:25px;width:min(470px,calc(100% - 28px));max-height:90dvh;overflow:auto}dialog::backdrop{background:#08130eb3;backdrop-filter:blur(5px)}.dialog-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}dialog h2{font:28px Georgia,serif;margin:0}label{font-size:11px;font-weight:600;display:block;color:var(--muted);margin-bottom:5px}input,textarea,select{width:100%;background:var(--input);color:var(--text);border:1px solid var(--line);padding:11px 12px;border-radius:9px;box-sizing:border-box;font-size:16px;margin-bottom:12px}textarea{resize:vertical;min-height:90px}.fields-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dialog-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:12px}.danger{color:var(--do)}.dialog-actions .danger{margin-right:auto}.pac-container{z-index:1000;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}.pac-item{color:var(--muted);padding:10px;border-color:var(--line)}.pac-item-query{color:var(--text)}.pac-item:hover,.pac-item-selected{background:var(--raised)}.gm-style-iw,.gm-style-iw-d{color:#23392a!important}.popup{font:13px/1.5 -apple-system,sans-serif;max-width:270px;padding:4px 4px 10px}.popup h3{font:23px Georgia,serif;margin:0 0 8px}.popup p{color:#657365;font-size:12px}.popup-links{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}.popup-links a{color:#355b40;border-color:#d4ddd4}.popup .btn{background:#355b40;color:white;width:100%}.sr-only{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}

@media(max-width:768px){.topbar{height:124px;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:9px}.brand-title{font-size:21px}.brand-sub{display:none}.brand-mark{width:34px;height:34px}.top-actions{grid-column:2;grid-row:1}.top-actions .new-label{display:none}.trip-picker{grid-row:2;grid-column:1/-1;width:100%;max-width:none;margin:0}.trip-picker select{max-width:none;flex:1;height:40px;padding:6px 12px}.trip-picker .btn{height:40px;min-height:40px}.workspace{height:calc(100dvh - 124px)}.map-wrap{position:absolute;inset:0}#map{height:calc(100% - 78px)}.map-wrap.sheet-open #map{height:24%}.sidebar{position:absolute;bottom:0;left:0;width:100%;height:76%;border:1px solid var(--line);border-bottom:0;border-radius:23px 23px 0 0;transform:translateY(calc(100% - 78px));transition:transform .28s ease;box-shadow:0 -12px 40px #0003;padding-bottom:env(safe-area-inset-bottom)}.sidebar.expanded{transform:translateY(0)}.sheet-handle{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;width:100%;min-height:76px;background:none;border:0;padding:21px 24px 13px;position:relative;touch-action:none}.sheet-handle:before{content:"";position:absolute;top:9px;left:calc(50% - 19px);width:38px;height:4px;border-radius:4px;background:var(--muted);opacity:.5}.sheet-handle strong{font:22px Georgia,serif}.sheet-handle span{font-size:11px;color:var(--muted)}.intro{padding:0 24px 13px}.intro h1{display:none}.intro-top{display:none}.intro p{font-size:11px}.search-wrap{padding:0 24px 12px}.filters{padding:0 24px 12px}.list-toolbar{padding-top:7px;padding-bottom:0}.sidebar-footer{padding:8px 24px}.map-caption{display:none}.map-tools{top:14px;right:14px}.map-help{bottom:97px;left:14px;font-size:10px;max-width:calc(100% - 85px)}.map-bottom{bottom:97px;right:14px}.map-wrap.sheet-open .map-bottom,.map-wrap.sheet-open .map-help{display:none}.toast{bottom:90px}.fields-row{grid-template-columns:1fr;gap:0}}

/* One scroll surface for search, filters, cards and connection status. */
.sidebar{min-height:0;overflow:hidden}
.sidebar-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-top:12px}
.place-list{overflow:visible;flex:none;padding:0 12px 10px}
.search-wrap{padding:0 12px 10px}.search-wrap .search-icon{left:26px}.search-wrap .clear{right:19px}
.filters{padding:0 12px 8px;gap:4px}
.card{margin:8px 0;border-radius:11px}.card-body{padding:9px}.card-main{gap:9px}
.thumb{height:62px;width:64px;border-radius:7px}.tag{margin-bottom:2px;letter-spacing:.8px}
.place-name{font-size:15px;line-height:1.25}.address{margin-top:3px;line-height:1.3}
.note{margin-top:7px;padding-left:7px;line-height:1.35}
.card-links{gap:5px;margin-top:8px;padding-top:7px}.card-links a{padding:4px 7px}
.photo-credit{padding:0 9px 5px}.sidebar-footer{padding:8px 12px}
.gm-style .gm-style-iw-c,.gm-style .gm-style-iw-d{background:var(--panel);color:var(--text)!important}
.gm-style .gm-style-iw-tc:after{background:var(--panel)}
.popup{color:var(--text);padding:2px 2px 8px}.popup-header{display:flex;align-items:flex-start;gap:8px}
.popup h3{flex:1;font-size:21px;margin:7px 0 5px}.popup p{color:var(--muted);margin:6px 0}
.popup .popup-close{flex-shrink:0;display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--raised);color:var(--text);font-size:28px;line-height:1}
.popup-links{margin:8px 0}.popup-links a{color:var(--text);border-color:var(--line)}
.popup .btn{background:var(--accent);color:var(--on-accent)}
@media(max-width:768px){.sidebar-scroll{padding-top:4px}.sheet-handle{min-height:76px}.search-wrap{padding:0 12px 8px}.filters{padding:0 12px 8px}.sidebar-footer{padding:8px 12px}}

/* Google supplies its own header and scrolling gutters; use our compact header. */
.gm-style .gm-style-iw-chr{display:none}
.gm-style .gm-style-iw-c{padding:12px!important}
.gm-style .gm-style-iw-d{padding:0!important;overflow-x:hidden!important;overflow-y:auto!important;max-width:100%;scrollbar-width:thin;scrollbar-color:var(--line) var(--panel)}
.gm-style .gm-style-iw-d::-webkit-scrollbar{width:6px;height:6px}
.gm-style .gm-style-iw-d::-webkit-scrollbar-track{background:var(--panel)}
.gm-style .gm-style-iw-d::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.popup{width:260px;max-width:min(260px,calc(100vw - 64px));padding:0;overflow-wrap:anywhere}
.popup-header{align-items:flex-start;gap:6px}.popup h3{margin:3px 0 5px;line-height:1.2;min-width:0}
.popup .popup-close{width:36px;height:36px;min-width:36px;font-size:24px}
.popup p{line-height:1.35}.popup-links{gap:4px;margin:7px 0}
.popup .popup-action{width:auto;min-height:32px;padding:5px 10px;font-size:12px;border-radius:7px;margin-top:2px}

<body>
<header class="topbar">
 <div class="brand"><div class="brand-mark" data-icon="compass"></div><div><div class="brand-title">Vacation Mapper</div></div></div>
 <div class="trip-picker"><label class="sr-only" for="tripSelect">Your trips</label><select id="tripSelect"><option value="">Choose a trip</option></select><button class="btn icon-only quiet" id="tripSettings" title="Trip settings" aria-label="Trip settings" data-icon="more"></button></div>
 <div class="top-actions"><button class="btn quiet" id="newTrip"><span data-icon="plus"></span><span class="new-label">New trip</span></button></div>
</header>
<main class="workspace">
 <aside class="sidebar" id="sidebar" aria-label="Saved places">
  <button class="sheet-handle" id="sheetHandle" aria-expanded="false" aria-controls="placeList"><strong>Your places</strong><span id="sheetCount">Tap to explore ↑</span></button>
  <div class="sidebar-scroll" id="sidebarScroll">
  <form class="search-wrap" id="searchForm" role="search"><span class="search-icon" data-icon="search"></span><label class="sr-only" for="search">Search places on the map</label><input id="search" placeholder="Find a place, a trail, a little adventure…" autocomplete="off"><button class="clear" id="clearSearch" type="button" aria-label="Clear search" hidden>×</button></form>
  <nav class="filters" id="filters" aria-label="Filter saved places"></nav>
  <div class="place-list" id="placeList"></div>
  <div class="sidebar-footer" role="status"><span class="status-dot" id="connectionDot"></span><span id="connection">Connecting to your shared trips…</span></div>
  </div>
 </aside>
 <section class="map-wrap" id="mapWrap" aria-label="Trip map"><div id="map"></div><div class="map-caption" id="mapCaption">Good things are out there. Let's find them.</div><div class="map-tools"><button class="btn" id="mapType"><span data-icon="layers"></span><span id="mapTypeLabel">Map</span></button></div><div class="map-bottom"><button class="btn icon-only" id="locate" aria-label="Find my location" title="Find my location" data-icon="locate"></button></div></section>
</main>
<dialog id="pinDialog"><form id="pinForm"><div class="dialog-header"><h2 id="pinHeading">Save a place</h2><button class="btn icon-only quiet close-dialog" type="button" aria-label="Close" data-icon="close"></button></div><label for="pName">Place name</label><input id="pName" required maxlength="250" placeholder="Somewhere worth stopping"><label for="pType">Category</label><select id="pType"><option value="🔴 Things to Do">Things to do</option><option value="🟢 Places to Stay">Places to stay</option><option value="🟡 Places to Eat">Places to eat</option></select><label for="pAddress">Address</label><input id="pAddress" placeholder="Street, town, or trailhead"><div class="fields-row"><div><label for="pPhone">Phone</label><input id="pPhone" type="tel"></div><div><label for="pLink">Website</label><input id="pLink" placeholder="https://…"></div></div><label for="pmUrl">Menu link · optional</label><input id="pmUrl" placeholder="https://…"><label for="pNotes">Your notes</label><textarea id="pNotes" placeholder="Why you saved it. What to remember. Who will love it."></textarea><div class="dialog-actions"><button class="btn quiet danger" id="deletePin" type="button" hidden>Delete place</button><button class="btn quiet close-dialog" type="button">Cancel</button><button class="btn primary" id="savePin" type="submit">Save place</button></div></form></dialog>
<dialog id="tripDialog"><form id="tripForm"><div class="dialog-header"><h2 id="tripHeading">Start an adventure</h2><button class="btn icon-only quiet close-dialog" type="button" aria-label="Close" data-icon="close"></button></div><label for="tripName">Trip name</label><input id="tripName" required maxlength="120" placeholder="Luray & the Shenandoah Valley"><p class="muted" style="font-size:12px">Your trips and saved places sync with your existing shared Vacation Mapper.</p><div class="dialog-actions"><button class="btn quiet danger" id="deleteTrip" type="button" hidden>Delete trip</button><button class="btn quiet close-dialog" type="button">Cancel</button><button class="btn primary" id="saveTrip" type="submit">Create trip</button></div></form></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const ICONS={compass:'<circle cx="12" cy="12" r="9"/><path d="m16 8-3 5-5 3 3-5Z"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',plus:'<path d="M12 5v14M5 12h14"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>',moon:'<path d="M20 14A8 8 0 0 1 10 4a8.5 8.5 0 1 0 10 10Z"/>',layers:'<path d="m12 3 9 5-9 5-9-5Zm-9 9 9 5 9-5m-18 5 9 5 9-5"/>',locate:'<circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',do:'<path d="m2 20 7-14 5 9 3-5 5 10ZM6 12l3 2 3-2"/>',stay:'<path d="M4 20V5m0 10h16v5M4 10h16v5M8 10V7h5v3m2 0V7h5v3"/>',eat:'<path d="M5 3v6a3 3 0 0 0 6 0V3M8 3v19m12 0V3c-5 3-5 10 0 10"/>'};
function icon(name){return '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[name]||ICONS.compass)+'</svg>'}
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
const categories=[{key:'do',type:'🔴 Things to Do',label:'Do',title:'Things to do',color:'#ff3030'},{key:'stay',type:'🟢 Places to Stay',label:'Stay',title:'Places to stay',color:'#00d852'},{key:'eat',type:'🟡 Places to Eat',label:'Eat',title:'Places to eat',color:'#ffe000'}];
const state={trips:{},active:store.get('vmapper_active_trip'),filter:'all',map:null,db:null,ready:false,connected:false,markers:new Map(),searchMarkers:[],photos:new Map(),photoRequests:new Set(),selected:null,searchToken:0};
const cat=p=>categories.find(c=>c.type===p.type)||categories[0];
function pins(){return Object.entries(state.trips[state.active]?.pins||{}).filter(([,p])=>p&&typeof p==='object').map(([key,p])=>({...p,_key:key}))}
function coords(p){const lat=Number(p.lat),lng=Number(p.lng);return p.lat!=null&&p.lng!=null&&Number.isFinite(lat)&&Number.isFinite(lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180?{lat,lng}:null}
function textEl(tag,text,cls){const el=document.createElement(tag);el.textContent=text;if(cls)el.className=cls;return el}
function safeURL(value){if(!value)return '';try{const raw=String(value).trim();const u=new URL(/^[a-z][a-z\d+.-]*:/i.test(raw)?raw:'https://'+raw);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
let toastTimer;function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,6500)}
function error(err){console.error(err);toast(err?.message||'Something went wrong. Please try again.')}
function mapStyles(){return [{elementType:'geometry',stylers:[{color:'#283b31'}]},{elementType:'labels.text.stroke',stylers:[{color:'#283b31'}]},{elementType:'labels.text.fill',stylers:[{color:'#afbaa8'}]},{featureType:'poi.park',elementType:'geometry',stylers:[{color:'#304b38'}]},{featureType:'water',elementType:'geometry',stylers:[{color:'#192e32'}]},{featureType:'road',elementType:'geometry',stylers:[{color:'#576254'}]},{featureType:'road.highway',elementType:'geometry',stylers:[{color:'#827c58'}]},{featureType:'transit',stylers:[{visibility:'off'}]}]}
function setSheet(open){$('sidebar').classList.toggle('expanded',open);$('mapWrap').classList.toggle('sheet-open',open);$('sheetHandle').setAttribute('aria-expanded',String(open));$('sheetCount').textContent=open?'Tap to collapse ↓':'Tap to explore ↑'}
